plugins {
    id "com.gradleup.shadow" version "9.6.0"
    id "maven-publish"
    id 'fabric-loom' version '1.17.16'
}

base {
    archivesName = project.archives_base_name
}


version = project.mod_version + "+" + stonecutter.current.version
group = project.maven_group

loom {
    // getDropItem() is abstract on AbstractMinecart in <1.21 and on VehicleEntity in >=1.21,
    // and it is package-private, so overriding it from our package needs a widener on the
    // right owner. Both files always exist, so this resolves at configuration time.
    accessWidenerPath = stonecutter.eval(stonecutter.current.version, ">=1.21")
            ? rootProject.file("src/main/resources/etched-1_21.accesswidener")
            : rootProject.file("src/main/resources/etched.accesswidener")
}

if (stonecutter.current.active) {
    loom {
        runConfigs.all {
            ideConfigGenerated = true
            runDir "../../run"
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
//    maven {
//        // location of the maven that hosts JEI files since January 2023
//        name = "Jared's maven"
//        url = "https://maven.blamejared.com/"
//    }
//    maven {
//        // location of a maven mirror for JEI files, as a fallback
//        name = "ModMaven"
//        url = "https://modmaven.dev"
//    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven { 
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://mvn.devos.one/snapshots/" }
    maven { url ="https://repo1.maven.org/maven2/"}
    maven { url = "https://jitpack.io/" }
    repositories {
        maven {
            name 'Xander Maven'
            url 'https://maven.isxander.dev/releases'
        }
    }
}

configurations {
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
}

dependencies {
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
    }

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_cofig_api_version}"
    modImplementation("dev.isxander:yet-another-config-lib:${project.yacl_version}")
    // forgeconfigscreens (dev-only config UI) was never updated past 1.20.1
    if (stonecutter.eval(stonecutter.current.version, "<1.21")) {
        modLocalRuntime "fuzs.forgeconfigscreens:forgeconfigscreens-fabric:${forge_cofig_api_version}"
    }
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modApi "com.terraformersmc:modmenu:${project.modmenu_version}"
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}")))
    modImplementation(include("com.tterrag.registrate_fabric:Registrate:${project.registrate_version}"))
            {exclude group: "com.github.llamalad7.mixinextras" }

    shadowCommon(implementation("javazoom:jlayer:1.0.1"))
    // AAC/.m4a decoding (net.sourceforge.jaad.*) — bundled and relocated in shadowJar
    shadowCommon(implementation("de.sfuhrm:jaad:0.8.7"))
}

processResources {
    inputs.property "mod_id", mod_id
    inputs.property "mod_version", mod_version
    inputs.property "mod_name", mod_name
    inputs.property "mod_description", mod_description
    inputs.property "archives_base_name", archives_base_name

    inputs.property "minecraft_version", minecraft_version

    def is121 = stonecutter.eval(stonecutter.current.version, ">=1.21")

    // Only ship the access widener that matches this version; loom remaps the active one.
    if (is121) {
        exclude "etched.accesswidener"
        // Only <1.21 references the placeholder config.
        exclude "etched.legacy.mixins.json"
    } else {
        exclude "etched-1_21.accesswidener"
        // The 1.21 jukebox mixins target classes that don't exist before 1.21.
        exclude "etched.jukebox.mixins.json"
        // The #minecraft:dyeable tag only exists on 1.21 (and uses the singular tags/item
        // folder); on 1.20.1 discs/labels are dyeable via the DyeableLeatherItem interface.
        exclude "data/minecraft/tags/item/dyeable.json"
    }

    // The 1.21 jukebox rewrite lives in its own mixin config. 1.20.1 keeps those mixins inside
    // etched.mixins.json, so it points at an empty placeholder config instead: naming
    // etched.mixins.json twice makes Fabric Loader refuse to start with "Non-unique Mixin config
    // name". The name has to stay a plain string here so the template is still valid json for the
    // tooling that reads it before expansion.
    def jukeboxMixins = is121 ? "etched.jukebox.mixins.json" : "etched.legacy.mixins.json"
    inputs.property "jukebox_mixins", jukeboxMixins

    filesMatching("fabric.mod.json") {
        expand "mod_version": mod_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_description": mod_description,
                "archives_base_name": archives_base_name,
                "jukebox_mixins": jukeboxMixins,

                "minecraft_version": minecraft_version
    }

    // Mixin classes compile to the version's Java target (21 on >=1.20.5, else 17); the mixin
    // compatibility level must match or Mixin rejects the classes at load.
    def mixinCompat = stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? "JAVA_21" : "JAVA_17"
    inputs.property "mixin_compat", mixinCompat
    filesMatching("etched.mixins.json") {
        expand "mixin_compat": mixinCompat
    }
}

def javaVersion = stonecutter.eval(stonecutter.current.version, ">=1.20.5") ? 21 : 17

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaVersion
}

java {
    def jv = JavaVersion.toVersion(javaVersion)
    sourceCompatibility = jv
    targetCompatibility = jv

    withSourcesJar()
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    relocate "javazoom", "gg.moonflower.etched.javazoom"
    relocate "net.sourceforge.jaad", "gg.moonflower.etched.jaad"
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}